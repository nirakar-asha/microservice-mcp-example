plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

group = 'com.nirakar.example.ms'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring AI + MCP + Microservice'

allprojects {

    apply plugin: 'java'

    repositories {
        // Use Maven Central for resolving dependencies.
        mavenCentral()
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.12.1') // Bill of Materials (BOM) ensures that all JUnit dependencies use the same version
        testImplementation 'org.junit.jupiter:junit-jupiter-api' // helps to write tests using JUnit 5 syntax
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine' // helps to runs the tests in JUnit Platform
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // Runs tests via IDE/build tools
    }

    // Apply a specific Java toolchain to ease working on different environments.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.named('test') {
        useJUnitPlatform() // tell Gradle to use the JUnit 5 platform instead of the older JUnit 4 runner.
    }
}




