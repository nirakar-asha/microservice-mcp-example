server:
  port: 8072

spring:
  application.name: gateway-server

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - "*"
  endpoint:
    gateway:
      access: READ_ONLY
    health:
      probes:
        enabled: true

info:
  app:
    name: "gateway-server"
    description: "API Gateway server"
    version: "1.0"
